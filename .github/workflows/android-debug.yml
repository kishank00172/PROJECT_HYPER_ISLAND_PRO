name: Android Debug APK

permissions:
  contents: write

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Setup-android action ko uda diya. Sirf ek chhota sa sanity check.
      - name: Check Android SDK
        run: echo "Android Home is running from $ANDROID_HOME"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      # Tests first: identity/ring logic is unit-testable and was the source of the "DMs vanished"
      # bug, so a red test must block the APK instead of shipping it to a phone for discovery.
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon --no-watch-fs

      # --no-watch-fs add kar diya
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --parallel --build-cache --configuration-cache --no-daemon --no-watch-fs
        
      - name: Upload debug APK
        # continue-on-error: quota exhaustion here must not redden a build that compiled fine,
        # and it must not block the release-asset step below.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          # Run-numbered so the download page tells you which build you are holding.
          # retention-days: 1 — artifact storage quota was full, which silently failed every
          # upload (job red, code fine). 1 day is enough to grab a test build.
          name: hip-b${{ github.run_number }}-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 1

      # Release assets live outside the Actions artifact quota, which is full — so this is the
      # reliable way to get a test build onto a phone. Delete the ci-<run> tag when you no longer
      # need the build.
      - name: Publish APK as a release asset
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          TAG="ci-$GITHUB_RUN_NUMBER"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "CI build $GITHUB_RUN_NUMBER ($GITHUB_REF_NAME)" \
              --notes "Automated test build from \`$GITHUB_SHA\`. Signed with the shared test key, so it installs **over** any previous CI build — no uninstall, no re-granting permissions."
          fi
          gh release upload "$TAG" "$APK" --clobber
          echo "::notice::APK -> https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$(basename "$APK")"
