name: Android Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # NOTE: Sdkmanager wala step hata diya hai kyunki Android 35 pre-installed aata hai.

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      # Parallel aur build-cache flags ke sath fast compilation
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --parallel --build-cache

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hyper-island-pro-phase0-debug-apk
          path: app/build/outputs/apk/debug/*.apk
