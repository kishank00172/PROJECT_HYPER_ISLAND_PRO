name: Android Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Tweak 1: Sirf latest code download karega
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      # Tweak 2 & 3: Configuration cache aur No-daemon ka combo
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --parallel --build-cache --configuration-cache --no-daemon
        
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hyper-island-pro-phase0-debug-apk
          path: app/build/outputs/apk/debug/*.apk
