name: Android Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        run: echo "Android Home is running from $ANDROID_HOME"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --parallel --build-cache --configuration-cache --no-daemon --no-watch-fs --offline

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hyper-island-pro-phase0-debug-apk
          path: app/build/outputs/apk/debug/*.apk
